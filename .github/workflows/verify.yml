name: CampusCare quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify scaffold structure
        run: node scripts/verify-scaffold.mjs
      - name: Smoke-test all Phase 1 pages
        run: node scripts/smoke-phase1.mjs
      - name: Smoke-test Phase 2 student pages
        run: node scripts/smoke-phase2.mjs
